name: MoneyPlan
options:
  bundleIdPrefix: com.moneyplan
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  # String catalog source language; en-US/pt-* variants live in Localizable.xcstrings.
  developmentLanguage: en

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.6.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "7"
    DEVELOPMENT_TEAM: "53K55422K6"
    CODE_SIGN_STYLE: Automatic

targets:
  MoneyPlan:
    type: application
    platform: iOS
    sources:
      - path: MoneyPlan
    resources:
      - path: MoneyPlan/Resources
        excludes:
          - "**/*.example"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moneyplann.app
        INFOPLIST_KEY_CFBundleDisplayName: Money Plan
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: MoneyPlan/MoneyPlan.entitlements
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: GoogleSignIn
        product: GoogleSignIn
    info:
      path: MoneyPlan/Info.plist
      properties:
        CFBundleDisplayName: Money Plan
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # REVERSED_CLIENT_ID from GoogleService-Info.plist — required by Google Sign-In.
        # Keep in sync if you ever rotate the OAuth client ID in Firebase.
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - com.googleusercontent.apps.21904977338-djdo9pqm66ntng396g6lh8cdsnq8p9gn
        # Required: without UILaunchScreen, iOS letterboxes the app into a legacy frame.
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Standard HTTPS only — exempt from export compliance paperwork on each upload.
        ITSAppUsesNonExemptEncryption: false

  MoneyPlanScreenshotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ScreenshotTests
    dependencies:
      - target: MoneyPlan
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MoneyPlan.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/MoneyPlan"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  MoneyPlan:
    build:
      targets:
        MoneyPlan: all
    archive:
      # Auto-increment build number before Product → Archive (App Store uploads need unique builds).
      preActions:
        - name: Bump iOS build number
          script: |
            cd "${SRCROOT}"
            ./scripts/bump-ios-version.sh
          settingsTarget: MoneyPlan
    test:
      targets:
        - MoneyPlanScreenshotTests
